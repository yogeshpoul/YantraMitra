name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.10.0

jobs:
  checks:
    name: Lint, typecheck, unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: yantramitra
          POSTGRES_PASSWORD: yantramitra
          POSTGRES_DB: yantramitra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yantramitra" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://yantramitra:yantramitra@localhost:5432/yantramitra_test
      TEST_DATABASE_URL: postgresql://yantramitra:yantramitra@localhost:5432/yantramitra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @yantramitra/api exec prisma generate
      - run: pnpm --filter @yantramitra/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: yantramitra
          POSTGRES_PASSWORD: yantramitra
          POSTGRES_DB: yantramitra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yantramitra" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://yantramitra:yantramitra@localhost:5432/yantramitra
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      INTERNAL_API_KEY: ci-internal-key
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_HOPS: "1"
      API_INTERNAL_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PW_CHANNEL: ""
      E2E_ADMIN_MOBILE: "7000000099"
      E2E_ADMIN_PASSWORD: ci-admin-password-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @yantramitra/api build
      - name: Database, catalogue, gazetteer and sample data
        run: |
          pnpm --filter @yantramitra/api exec prisma migrate deploy
          pnpm --filter @yantramitra/api db:seed
          pnpm --filter @yantramitra/api places:import IN
          pnpm --filter @yantramitra/api db:seed:dev
          ADMIN_MOBILE=$E2E_ADMIN_MOBILE ADMIN_NAME="CI Admin" ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD pnpm --filter @yantramitra/api admin create
      - run: pnpm --filter @yantramitra/web build
      - name: Start API and website
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on@8 -t 120000 http://localhost:4000/api/v1/health http://localhost:3000/en
      - run: pnpm --filter @yantramitra/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results
            api.log
            web.log
          retention-days: 7
